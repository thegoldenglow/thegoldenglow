[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/telegram/webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/telegram/webhook-info"
  to = "/.netlify/functions/telegram-webhook-info"
  status = 200
  force = true

[[redirects]]
  from = "/telegram/set-webhook"
  to = "/.netlify/functions/telegram-set-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-telegram-membership"
  to = "/.netlify/functions/verify-telegram-membership"
  status = 200
  force = true

[[redirects]]
  from = "/telegram/final-clean-webhook"
  to = "/.netlify/functions/final-clean-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/telegram/set-final-clean-webhook"
  to = "/.netlify/functions/set-final-clean-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
